# PH-050: the boss bent sideways (load on its top face) off the plate,
# whose base is clamped; the peak is on the boss's 0.08 root fillet.
units = "mm"
material = "PLA (FDM)"

[faces]
base = { plane = { normal = [0, 0, -1], through = [0, 0, 0] } }
boss_top = { plane = { normal = [0, 0, 1], through = [0, 0, 1.0] } }

[[support]]
faces = ["base"]
kind = "fixed"

[[load]]
faces = ["boss_top"]
force_n = 1
direction = [1, 0, 0]
