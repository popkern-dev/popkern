# PH-075: CalculiX gate cases (gate.py). `mesh` is CalculiX's Gmsh mesh
# [max size, points per 2π of curvature] (PH-050: the coarse and fine
# meshes agree to 0.3% in displacement and 0.2% in peak); `cell_size`
# ours (default budget when absent). Each check's `ratio` is ours over
# CalculiX as recorded (gate.py --record) and must stay within
# `tolerance`. Recorded 2026-10-12 (PH-075); the PH-050 table in the
# map has the same parts against the finer meshes.

[[case]]
name = "bored_block"
kind = "structural"
step = "tests/fixtures/analysis/gallery/bored_block.step"
setup = "tools/analysis/calculix/cases/bored_block.setup.toml"
mesh = [0.06, 24]
roi = { lo = [-0.3, -9.0, -9.0], hi = [0.3, 9.0, 9.0] }
checks.displacement = { ratio = 0.9970, tolerance = 0.01 }
checks.peak = { ratio = 0.9429, tolerance = 0.02 }

