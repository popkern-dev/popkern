# PH-105 sweep setup (tools/cli-sweep/sweep.py): faces by raw id so it fits any part.
analysis = "thermal"
units = "mm"
material = "Aluminium 6061-T6"
[[heat_source]]
power_w = 1
[[convection]]
faces = "all_other"
h = 10
ambient_c = 20
[transient]
initial_c = 20
step_s = 0.5
duration_s = 2
[options]
max_active_cells = 3000
