name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # PK-270: three legs, not the full 2×2 product — nightly×macos
      # never caught anything stable×macos + nightly×ubuntu miss, and
      # macOS minutes bill at 10×.
      matrix:
        include:
          - rust: stable
            os: ubuntu-latest
          - rust: stable
            os: macos-latest
          - rust: nightly
            os: ubuntu-latest
    env:
      # Hosted runners exhaust their ~14 GB free disk linking the full
      # nextest binary set with debuginfo (ld dies with SIGBUS once the
      # disk fills). CI stack traces come from test names, not debug
      # symbols, so drop debuginfo in CI builds only.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~25 GB of preinstalled toolchains we never use; the
      # workspace's test dep graph at opt-2 does not fit otherwise.
      - name: Free runner disk space
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # PK-270: fmt and doc are platform- and toolchain-independent
      # outputs; one leg owns them instead of every leg repeating the
      # same work (doc alone recompiles the 743k-line workspace).
      - name: Format check
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Check without default features
        # The cfg(not(feature)) fallback arms (sequential dispatch,
        # windowless viz) are never compiled otherwise.
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo check --workspace --no-default-features

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # PK-267: nextest runs all test binaries in one parallel
      # schedule (cargo test runs them sequentially — the fillet
      # integration phase alone was measured essentially serial for
      # ~57 min) and isolates each test in its own process. nextest
      # does not run doctests; the --doc leg follows (cargo test
      # --all-targets never ran them either).
      #
      # PK-270: explicit --lib --bins --tests target set — the old
      # --all-targets also compiled AND executed the criterion
      # benches on every leg; a separate `cargo build --all-targets`
      # immediately before was a fully redundant invocation.
      - name: Test
        run: cargo nextest run --workspace --lib --bins --tests --profile ci

      - name: Doc tests
        run: cargo test --doc --workspace

      - name: Doc build
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --document-private-items

  perf:
    # PK-190 performance gate: absolute wall-clock budgets (measured
    # baseline × 5 headroom — see tests/perf_budget.rs headers) plus
    # the §17 < 1 s cancellation-latency claim. Release mode only:
    # debug timings are meaningless and the budget tests self-skip.
    name: Performance budgets (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fillet perf budgets + §17 cancellation latency
        run: |
          cargo test --release -p popkern-fillet \
            --test perf_budget --test cancellation_latency --test perf_acceptance \
            -- --nocapture

      - name: Smooth-mesh perf budgets
        run: cargo test --release -p popkern-part --test perf_budget -- --nocapture

      - name: Boolean perf budgets
        run: cargo test --release -p popkern-bool --test perf_budget -- --nocapture

      - name: Tessellation perf budgets
        run: cargo test --release -p popkern-mesh --test perf_budget -- --nocapture

      - name: Offset/shell perf budgets + determinism pins
        run: |
          cargo test --release -p popkern-examples \
            --test perf_budget --test offset_determinism_gates \
            -- --nocapture
