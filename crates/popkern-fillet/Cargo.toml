[package]
name = "popkern-fillet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fillets and chamfers for the popkern BRep kernel"

[dependencies]
popkern-core = { path = "../popkern-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
popkern-bool = { path = "../popkern-bool" }
popkern-mesh = { path = "../popkern-mesh" }
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
serde_json = "1"
backtrace = "0.3"

[[bench]]
name = "modify_inplace_speedup"
harness = false

[[bench]]
name = "fillet_perf"
harness = false
