[package]
name = "popkern-fillet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fillets and chamfers for the popkern BRep kernel"

[features]
# Parallel corner presolve (PK-278). Default-on: output is bit-identical
# with or without it (the presolve is a pure solve gated on exact input
# equality), so opting out is a resource decision, not a correctness one.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
popkern-core = { path = "../popkern-core" }
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Thread-pool control for the PK-278 determinism pins.
rayon = "1"
popkern-bool = { path = "../popkern-bool" }
popkern-mesh = { path = "../popkern-mesh" }
popkern-io = { path = "../popkern-io" }
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
serde_json = "1"
backtrace = "0.3"

[[bench]]
name = "modify_inplace_speedup"
harness = false

[[bench]]
name = "fillet_perf"
harness = false
