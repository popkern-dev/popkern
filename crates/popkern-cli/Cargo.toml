[package]
name = "popkern-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `popkern` command: run a Rhai model script, report, export STEP/PNG/.pkn, rebuild on save"

[[bin]]
name = "popkern"
path = "src/main.rs"

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-part = { path = "../popkern-part" }
popkern-script = { path = "../popkern-script" }
popkern-rhai = { path = "../popkern-rhai" }
# CPU software renderer only: no GPU or window stack behind the CLI.
popkern-viz = { path = "../popkern-viz", default-features = false }
# Zebra renders pick their analysis mesh's facet bound.
popkern-mesh = { path = "../popkern-mesh" }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Host parity gate: the browser engine and the command share one class
# partition (crates/popkern-cli/tests/playground_parity.rs).
popkern-playground = { path = "../popkern-playground" }
