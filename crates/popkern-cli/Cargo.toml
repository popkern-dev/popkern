[package]
name = "popkern-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `popkern` command: run a Rhai model script, report, export STEP/PNG/.pkn, rebuild on save"

[[bin]]
name = "popkern"
path = "src/main.rs"

[features]
default = ["h264"]
# MP4 output through OpenH264 (see the note above `openh264`).
h264 = ["dep:openh264"]

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-part = { path = "../popkern-part" }
popkern-script = { path = "../popkern-script" }
popkern-rhai = { path = "../popkern-rhai" }
popkern-assembly = { path = "../popkern-assembly" }
popkern-project = { path = "../popkern-project" }
popkern-server = { path = "../popkern-server" }
popkern-live = { path = "../popkern-live" }
# `popkern film --out` drives headless Chrome over the DevTools
# protocol (the client popkern-server already depends on).
tungstenite = "0.24"
# CPU software renderer only: no GPU or window stack behind the CLI.
popkern-viz = { path = "../popkern-viz", default-features = false }
# Zebra renders pick their analysis mesh's facet bound.
popkern-mesh = { path = "../popkern-mesh" }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Native film rendering (cli-render-export.md §5): caption glyphs, GIF
# and MP4 encoding. H.264 (OpenH264, built from source) is the default
# `h264` feature: OpenH264's patent licence covers Cisco's binaries
# only, so a distributor can build without it.
fontdue = "0.9"
gif = "0.14"
mp4 = "0.14"
bytes = "1"
openh264 = { version = "0.9", optional = true }
image = { workspace = true }

# musl's allocator ran the six-axis arm 2.25x slower than glibc's
# (71.6 s vs 31.8 s, 2026-10-14); the static release builds use
# mimalloc instead. glibc builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# STL tests gate the export's volume on the BRep's own.
popkern-measure = { path = "../popkern-measure" }
