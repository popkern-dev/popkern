[package]
name = "popkern-constraint"
version = "0.1.0"
edition = "2021"
description = "2D geometric constraint solver for parametric sketch modeling"

[dependencies]
faer = "0.20"
slotmap = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
