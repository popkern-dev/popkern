[package]
name = "popkern-playground"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Browser playground engine: a Rhai model script in, triangle buffers + replay report + §10 diagnostics out (wasm-bindgen)"

[lib]
# `cdylib` is the wasm module the page loads; `rlib` keeps the engine
# testable natively (the envelope, the class partition, the budgets).
crate-type = ["cdylib", "rlib"]

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-mesh = { path = "../popkern-mesh" }
popkern-rhai = { path = "../popkern-rhai" }
popkern-script = { path = "../popkern-script" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The JS boundary exists only on the browser target: a native build of
# the engine (tests, the daemon later) never links wasm-bindgen.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.114"
js-sys = "0.3.91"

[dev-dependencies]
popkern-part = { path = "../popkern-part" }
