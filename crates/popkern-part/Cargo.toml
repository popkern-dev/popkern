[package]
name = "popkern-part"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Code-first part modeling API over the popkern BRep kernel"

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-bool = { path = "../popkern-bool" }
popkern-blend = { path = "../popkern-blend" }
popkern-sweep = { path = "../popkern-sweep" }
popkern-sketch = { path = "../popkern-sketch" }
popkern-io = { path = "../popkern-io" }
popkern-shell = { path = "../popkern-shell" }
popkern-draft = { path = "../popkern-draft" }
popkern-mesh = { path = "../popkern-mesh" }
thiserror.workspace = true
ttf-parser = { workspace = true, optional = true }

[features]
default = []
text = ["dep:ttf-parser"]

[dev-dependencies]
# PK-276 identity-pin fingerprints.
serde_json.workspace = true
