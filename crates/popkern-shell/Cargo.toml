[package]
name = "popkern-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shell and offset solid operations for the popkern BRep kernel"

[features]
# Parallel per-face/per-edge dispatch is on by default (PK-329): output
# is positionally identical to sequential processing at any thread count
# (ordered collect over a deterministic task list), so opting out is a
# resource decision, not a correctness one. rayon is already in the
# workspace tree via faer, so the default adds no new transitive dep.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
popkern-math = { path = "../popkern-math" }
popkern-core = { path = "../popkern-core" }
popkern-blend = { path = "../popkern-blend" }
popkern-bool = { path = "../popkern-bool" }
rayon = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# PK-276 identity-pin fingerprints.
serde_json.workspace = true
# The determinism pins build their own rayon pools (PK-329).
rayon.workspace = true
