[package]
name = "popkern-viz"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "popkern-viz"
path = "src/main.rs"

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-mesh = { path = "../popkern-mesh" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = "24"
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
env_logger = "0.11"
log = "0.4"
