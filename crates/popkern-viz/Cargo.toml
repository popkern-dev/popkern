[package]
name = "popkern-viz"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "popkern-viz"
path = "src/main.rs"
required-features = ["gpu"]

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:eframe", "dep:egui"]

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-mesh = { path = "../popkern-mesh" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "24", optional = true }
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", features = ["wgpu"], optional = true }
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
softbuffer = "0.4"
winit = "0.30"
