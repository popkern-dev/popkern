[package]
name = "popkern-viz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Debug visualization and headless CPU/GPU rendering for popkern BReps"

[[bin]]
name = "popkern-viz"
path = "src/main.rs"
required-features = ["gpu"]

[features]
default = ["gpu", "window"]
# Interactive GPU viewer (wgpu + egui). The headless GPU render path
# and the `popkern-viz` binary need this.
gpu = ["dep:wgpu", "dep:eframe", "dep:egui", "dep:pollster", "dep:env_logger"]
# Windowed CPU software viewer (winit + softbuffer). Headless CPU
# rendering (`render_to_png` fallback) works without it.
window = ["dep:winit", "dep:softbuffer"]

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-mesh = { path = "../popkern-mesh" }
popkern-measure = { path = "../popkern-measure" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
glam.workspace = true
bytemuck = { version = "1", features = ["derive"] }
image.workspace = true
wgpu = { version = "24", optional = true }
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", features = ["wgpu"], optional = true }
pollster = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
log = "0.4"
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.30", optional = true }
