[package]
name = "popkern-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Core topology, geometry, and validation for the popkern BRep kernel"

[features]
# Parallel read-only measurement passes (PK-302: stale-pcurve scan).
# Default-on: results are bit-identical with or without it (indexed
# ordered collect over a deterministic task list), so opting out is a
# resource decision, not a correctness one.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
popkern-math = { path = "../popkern-math" }
rayon = { workspace = true, optional = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
faer = "0.20"
# Stage 2b.36: exact rational arithmetic for the symbolic Levin path
# (Q[√d] foundation — rational pencil + rational root finding; the
# √-bearing eigenvectors that define the field extension are layered
# on top in `levin::rational`).
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }

[dev-dependencies]
