[package]
name = "popkern-analysis-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Command-line runner: STEP part and setup file in, report out"

[[bin]]
name = "popkern-analysis"
path = "src/main.rs"

[dependencies]
popkern-analysis = { path = "../popkern-analysis" }
popkern-analysis-brep = { path = "../popkern-analysis-brep" }
popkern-analysis-setup = { path = "../popkern-analysis-setup" }
popkern-io = { path = "../popkern-io" }
popkern-core = { path = "../popkern-core" }
popkern-mesh = { path = "../popkern-mesh" }
popkern-viz = { path = "../popkern-viz", default-features = false }
# The version popkern-viz's camera takes (popkern's workspace pin).
glam = { workspace = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
sha2 = "0.10"


[dev-dependencies]
popkern-analysis-fixtures = { path = "../popkern-analysis-fixtures" }
popkern-part = { path = "../popkern-part" }
