[package]
name = "popkern-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tessellation and mesh export for popkern BRep solids"

[features]
# Parallel per-face tessellation is on by default (PK-277): faces are
# dispatched with ordered collection, so output is identical to the
# sequential path at any thread count. rayon is already in the
# workspace tree via faer, so the default adds no new transitive dep.
default = ["parallel"]
parallel = ["rayon"]

[dependencies]
popkern-core = { path = "../popkern-core" }
rayon = { version = "1", optional = true }
thiserror = "2"

[dev-dependencies]
popkern-bool = { path = "../popkern-bool" }
popkern-fillet = { path = "../popkern-fillet" }
popkern-shell = { path = "../popkern-shell" }
popkern-sweep = { path = "../popkern-sweep" }
# The tessellation determinism pins build their own rayon pools to
# compare 1-thread vs N-thread output (PK-277).
rayon = "1"
serde_json = "1"
tempfile = "3"
