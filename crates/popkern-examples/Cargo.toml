[package]
name = "popkern-examples"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Example builders return rich kernel error enums by value; call sites are
# one-shot demos, not hot paths. Package-level (not lib.rs) because each
# example bin is its own crate root and a lib.rs allow would not reach them.
[lints.clippy]
result_large_err = "allow"

[dependencies]
popkern-core = { path = "../popkern-core" }
popkern-bool = { path = "../popkern-bool" }
popkern-fillet = { path = "../popkern-fillet" }
popkern-sweep = { path = "../popkern-sweep" }
popkern-shell = { path = "../popkern-shell" }
popkern-draft = { path = "../popkern-draft" }
popkern-io = { path = "../popkern-io" }
popkern-part = { path = "../popkern-part", features = ["text"] }
popkern-mesh = { path = "../popkern-mesh" }
popkern-measure = { path = "../popkern-measure" }
popkern-viz = { path = "../popkern-viz" }
glam = "0.29"
serde_json = "1"
ttf-parser = "0.25.1"

[[bin]]
name = "flagship_boss_plate"
path = "src/flagship_boss_plate.rs"

[[bin]]
name = "boolean_showcase"
path = "src/boolean_showcase.rs"

[[bin]]
name = "kp20_paper_cap_showcase"
