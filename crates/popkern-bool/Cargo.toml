[package]
name = "popkern-bool"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boolean operations (union, intersection, subtraction) on BRep solids"

[features]
# Parallel face-face intersection is on by default (PK-277): output is
# positionally identical to sequential processing at any thread count
# (ordered collect over a deterministic task list), so opting out is a
# resource decision, not a correctness one. rayon is already in the
# workspace tree via faer, so the default adds no new transitive dep.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
popkern-math = { path = "../popkern-math" }
popkern-core = { path = "../popkern-core" }
rayon = { workspace = true, optional = true }
slotmap.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The boolean determinism pins build their own rayon pools (PK-300).
rayon.workspace = true
# Test-only sibling dependency (the mesh crate uses the same pattern
# for this crate): the boolean perf budget (PK-272) needs a
# filleted-operand fixture, and fillet strips can only come from the
# fillet crate. The library dependency graph stays acyclic —
# popkern-blend's lib depends only on popkern-core.
popkern-blend = { path = "../popkern-blend" }
# Test-only (PK-704): profile sheets with arcs placed against the
# cylinder chart seam; popkern-sketch depends only on core/constraint.
popkern-sketch = { path = "../popkern-sketch" }
