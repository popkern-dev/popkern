# cargo-about configuration — generates THIRD-PARTY-NOTICES.md
# (PK-373). Regenerate: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
# The accepted set mirrors deny.toml; cargo-deny is the gate, this file
# only needs to know which texts to collect.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Rhai's `smartstring` is MPL-2.0+ (crate-scoped exception, ADR
# docs/decisions/2026-09-02-mpl-dependency-exception-smartstring.md).
[smartstring]
accepted = ["MPL-2.0"]

