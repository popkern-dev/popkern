[workspace]
resolver = "2"
members = ["crates/popkern-core", "crates/popkern-bool", "crates/popkern-draft", "crates/popkern-blend", "crates/popkern-sweep", "crates/popkern-shell", "crates/popkern-io", "crates/popkern-mesh", "crates/popkern-part", "crates/popkern-measure", "crates/popkern-viz", "crates/popkern-examples", "crates/popkern-constraint", "crates/popkern-sketch", "crates/popkern-history", "crates/popkern-script", "crates/popkern-rhai", "tools/lints", "tools/structural-tests"]
# Probe crates build on their own (own lockfile, own deps such as pyo3)
# so they never enter the kernel build or the cargo-deny graph.
exclude = ["probes/pyo3-diagnostics"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"

# Test profile optimisation. Numerical hotspots (Bernstein evaluations,
# ~32×32 QP solves, dense G1/G2 sampling) run 10-12× faster at
# opt-level=2 than debug (measured on `validation_sweep`: 291s → 25s).
# Measured 2026-08-15 (PK-266 falsified): this profile applies to the
# WHOLE test-unit dependency graph — popkern_core and faer both
# compile at opt-level=2, debug-assertions=on in `cargo test` builds
# (verified via rustc -v flags), so a [profile.dev] opt-level would
# not change suite time. Debug integration wall ≈ release confirms it.
# `debug-assertions = true` preserves `debug_assert!` coverage.
# `debug = "line-tables-only"` keeps file:line in backtraces while
# shrinking the ~185 test binaries 5-10× (full-debuginfo deps grew to
# 100 GiB and filled the disk, 2026-07-30). For a full-debuginfo run:
# CARGO_PROFILE_TEST_DEBUG=2 cargo test …
[profile.test]
opt-level = 2
debug-assertions = true
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
slotmap = { version = "1", features = ["serde"] }
rayon = "1"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
ttf-parser = "0.25.1"
