[workspace]
resolver = "2"
members = ["crates/popkern-core", "crates/popkern-bool", "crates/popkern-draft", "crates/popkern-fillet", "crates/popkern-sweep", "crates/popkern-shell", "crates/popkern-io", "crates/popkern-mesh", "crates/popkern-part", "crates/popkern-measure", "crates/popkern-viz", "crates/popkern-examples", "crates/popkern-constraint", "crates/popkern-sketch", "crates/popkern-history", "tools/lints", "tools/structural-tests"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"

# Test profile optimisation. Numerical hotspots (Bernstein evaluations,
# ~32×32 QP solves, dense G1/G2 sampling) run 10-12× faster at
# opt-level=2 than debug (measured on `validation_sweep`: 291s → 25s).
# `debug-assertions = true` preserves `debug_assert!` coverage.
[profile.test]
opt-level = 2
debug-assertions = true
