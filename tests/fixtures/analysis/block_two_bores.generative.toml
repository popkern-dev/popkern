# PH-116 run fixture: the bored block as a design space, clamped on its
# base and sheared on its top face, keeping 30% of its material and
# the top face's layer. Crisp (the default) and printable base-down
# without supports (PH-119). Cells default to a third of the filter
# radius, 0.5 mm (PH-127).
units = "mm"
material = "PLA (FDM)"

[faces]
base = { plane = { normal = [0, 0, -1], through = [0, 0, 0] } }
top = { plane = { normal = [0, 0, 1], through = [0, 0, 10] } }

[[support]]
faces = ["base"]
kind = "fixed"

[[load]]
faces = ["top"]
force_n = 100
direction = [1, 0, 0]

[generative]
volume_fraction = 0.3
filter_mm = 1.5
keep = ["top"]
keep_mm = 1.0
max_iterations = 300
build_direction = "+z"
