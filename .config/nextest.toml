# cargo-nextest configuration (PK-267).
#
# nextest schedules all test binaries into one parallel run (cargo
# test runs binaries strictly sequentially — measured 2026-08-14:
# popkern-fillet's 67 integration binaries ran an essentially serial
# ~57 min phase on 16 cores) and runs each test in its own process,
# which isolates the env::set_var test files and the alloc-profile
# lock by construction.
#
# nextest does NOT run doctests: every suite leg pairs `cargo nextest
# run` with a `cargo test --doc` leg (quality-check.sh, ci.yml).

[profile.default]
# Long-running kernel gates (validation_sweep, apex contract
# matrices) are legitimate multi-minute tests: report slowness but
# never kill them.
slow-timeout = { period = "120s" }

# This machine does other development work alongside test runs: cap
# the suite at 12 of the 16 hardware threads so a sweep never
# saturates the box. (Wall-clock baselines recorded before
# 2026-08-15 were measured at the default 16.)
test-threads = 12

# The KP20-recovery candidate-ranking battery (kp20_bi6
# tau_solve_assemble / cc_ring / guide_lsq / local_constraint) runs
# in the default sweep. PK-268 carved it out to a nightly tier when
# it held 9,048 s of the suite's 12,362 s CPU (73%); PK-289 cut the
# battery to 3,108 s CPU (~315 s wall at 12 threads), and on
# 2026-08-16 Graeme chose per-push coverage over the saved minutes,
# so the carve-out and the nightly kp20-battery job were removed.

[profile.ci]
# CI wants the complete failure picture in one run.
fail-fast = false
failure-output = "immediate-final"
