# cargo-nextest configuration (PK-267).
#
# nextest schedules all test binaries into one parallel run (cargo
# test runs binaries strictly sequentially — measured 2026-08-14:
# popkern-blend's 67 integration binaries ran an essentially serial
# ~57 min phase on 16 cores) and runs each test in its own process,
# which isolates the env::set_var test files and the alloc-profile
# lock by construction.
#
# nextest does NOT run doctests: every suite leg pairs `cargo nextest
# run` with a `cargo test --doc` leg (quality-check.sh, ci.yml).

[profile.default]
# Long-running kernel gates (validation_sweep, apex contract
# matrices) are legitimate multi-minute tests: report slowness but
# never kill them.
slow-timeout = { period = "120s" }

# This machine does other development work alongside test runs: cap
# the suite at 12 of the 16 hardware threads so a sweep never
# saturates the box. (Wall-clock baselines recorded before
# 2026-08-15 were measured at the default 16.)
test-threads = 12

# The KP20-recovery candidate-ranking battery (kp20_bi6
# tau_solve_assemble / cc_ring / guide_lsq / local_constraint) runs
# in the default sweep. PK-268 carved it out to a nightly tier when
# it held 9,048 s of the suite's 12,362 s CPU (73%); PK-289 cut the
# battery to 3,108 s CPU (~315 s wall at 12 threads), and on
# 2026-08-16 Graeme chose per-push coverage over the saved minutes,
# so the carve-out and the nightly kp20-battery job were removed.

# Tests that build the whole six-axis arm (or a full cycloidal joint
# module, or every gallery script) are the suite's heaviest: each
# drives rayon's full pool for a minute or more. On 2026-10-14 each
# held 13.5-16.5 GB (a debug-only validate_all after every boolean,
# since gated to POPKERN_TRACE=boolean; arm_build_memory gates the
# peak now), and an arm-filtered sweep ran nine at once (~125 GB),
# exhausted RAM and swap and hung the host for 3.5 h. Containment for
# the next such regression: at most two run concurrently; everything
# else still uses the 12 threads around them.
# Two suites (PK-948, docs/architecture/analysis-integration.md). The
# default profile (and every profile inheriting it: ci) is the kernel
# suite: it leaves out the physics crates, whose own suite runs 30-60
# minutes, and keeps the adapter's unit tests (seconds) as the smoke
# set that catches a kernel change breaking the BRep -> AnalysisModel
# seam. The physics profile below runs the physics crates only:
#   cargo nextest run --workspace --profile physics
# A `-p` on the default profile intersects with this filter, so
# `-p popkern-analysis` there selects nothing; use --profile physics.
default-filter = """
    not package(/^popkern-analysis/)
    | (package(popkern-analysis-brep) & kind(lib))
"""

[[profile.default.overrides]]
filter = """
    binary(/^six_axis_arm/)
    | binary(arm_build_memory)
    | binary(arm_target_posing)
    | binary(cycloidal_joint)
    | (package(popkern-cli) & binary(gallery))
"""
test-group = "whole-arm"

[test-groups]
whole-arm = { max-threads = 2 }

[profile.ci]
# CI wants the complete failure picture in one run.
fail-fast = false
failure-output = "immediate-final"

# The physics suite: the analysis solver, the BRep adapter, the CLI's
# fixture and corpus gates, the fixture generator and the wasm bench.
# It reads frozen STEP fixtures (tests/fixtures/analysis), so a kernel
# commit moves it only through import, tessellation and measurement;
# run it when an analysis crate changes, when the fixtures are
# regenerated, and before a push that touches popkern-io, -mesh,
# -measure or -core.
[profile.physics]
default-filter = "package(/^popkern-analysis/)"
fail-fast = false

# Ranking-identity audit harness for the kp20_bi6 candidate-ranking
# battery (PK-291). Runs only the battery and stores every test's
# captured output in JUnit XML so two runs can be compared
# structurally (ranking orders, verdict labels, counts) across a
# solver change whose floating-point path differs in ULPs. Compare
# with tools/battery-ranking-diff.py.
#   cargo nextest run -p popkern-core --profile battery-audit
# Output: target/nextest/battery-audit/battery-audit.xml
[profile.battery-audit]
default-filter = "test(/kp20_bi6_(tau_solve_assemble|cc_ring|guide_lsq|local_constraint)::/)"
fail-fast = false

[profile.battery-audit.junit]
path = "battery-audit.xml"
store-success-output = true
store-failure-output = true
